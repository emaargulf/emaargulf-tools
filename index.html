<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Portal | Emaar Gulf Engineering</title>
    <!-- Developer/Author: archengsafdar@gmail.com -->
    <style>
        :root {
            /* Premium Emaar Gulf Corporate Palette */
            --brand-navy: #0B1D35;
            --brand-gold: #C5A059;
            --brand-gold-light: #DBC38B;
            --bg-color: #F8F9FA;
            --text-main: #333333;
            --text-muted: #666666;
            --card-bg: #FFFFFF;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Top Brand Ribbon */
        .brand-ribbon {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--brand-navy) 0%, var(--brand-gold) 100%);
        }
        
        header { 
            text-align: center; 
            margin-top: 4rem;
            margin-bottom: 3rem; 
            padding: 0 1.5rem;
        }
        
        h1 { 
            color: var(--brand-navy); 
            font-size: 2rem; 
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem; 
        }
        
        p.subtitle { 
            color: var(--brand-gold); 
            font-size: 0.95rem; 
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        main { 
            width: 100%; 
            max-width: 500px; 
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
        }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 2px; /* Sharper edges for architectural feel */
            padding: 3rem 2rem; 
            text-align: center; 
            text-decoration: none; 
            color: inherit; 
            width: 100%;
            box-shadow: 0 10px 30px rgba(11, 29, 53, 0.05); 
            border-top: 3px solid transparent;
            transition: all 0.3s ease; 
        }
        
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 35px rgba(11, 29, 53, 0.1); 
            border-top: 3px solid var(--brand-gold);
        }
        
        .icon { 
            font-size: 3rem; 
            margin-bottom: 1.5rem; 
            color: var(--brand-navy);
        }
        
        .card h2 { 
            color: var(--brand-navy); 
            font-size: 1.4rem; 
            margin-bottom: 1rem; 
            font-weight: 600;
        }
        
        .card p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            line-height: 1.6;
        }

        .btn-text {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--brand-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card:hover .btn-text {
            color: var(--brand-navy);
        }
        
        footer { 
            margin-top: auto; 
            padding: 3rem 1.5rem; 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            text-align: center; 
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="brand-ribbon"></div>
    
    <header>
        <h1>Emaar Gulf</h1>
        <p class="subtitle">Engineering Consultants</p>
    </header>

    <main>
        <!-- Explicitly routing to the HTML file inside the eid folder -->
        <a href="eid/index.html" class="card">
            <div class="icon">🌙</div>
            <h2>Eid Greetings Portal</h2>
            <p>Access the official Emaar Gulf Eid Al-Adha greeting cards and interactive assets for client distribution.</p>
            <span class="btn-text">Open Portal &rarr;</span>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 EMAAR GULF ENGINEERING CONSULTANTS. ALL RIGHTS RESERVED.</p>
    </footer>
</body>
</html>
